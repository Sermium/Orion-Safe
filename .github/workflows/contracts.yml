name: contracts

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
      - '.github/scripts/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # Built one crate at a time so a failure names the crate directly, and
      # compiler errors are echoed as workflow annotations. Annotations render
      # inline on the PR and are readable without pulling the full job log.
      - name: Build vault (wasm)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cargo-annotate.sh" build --release --target wasm32v1-none -p stellar-vault

      - name: Build factory (wasm)
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cargo-annotate.sh" build --release --target wasm32v1-none -p stellar-vault-factory

      - name: Build registry (wasm)
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cargo-annotate.sh" build --release --target wasm32v1-none -p stellar-vault-registry

      - name: Report wasm sizes and hashes
        run: |
          ls -l target/wasm32v1-none/release/*.wasm
          sha256sum target/wasm32v1-none/release/*.wasm

      # Local builds are blocked on the maintainer's machine by Smart App Control,
      # so CI is the source of deployable artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: contracts/target/wasm32v1-none/release/*.wasm

      - name: Test
        env:
          CARGO_ANNOTATE_LOG: ${{ runner.temp }}/test.log
        run: bash "$GITHUB_WORKSPACE/.github/scripts/cargo-annotate.sh" test --workspace -- --nocapture

      # cargo test exits 0 when a crate contains no tests at all, which is how
      # the missing `mod test;` declarations went unnoticed for months. Fail if
      # the number of passing tests drops below what we know exists.
      - name: Guard against unwired test modules
        env:
          MIN_TESTS: '42'
        run: |
          total=$(grep -oE "test result: ok. [0-9]+ passed" "${{ runner.temp }}/test.log" | grep -oE "[0-9]+" | awk '{s+=$1} END {print s+0}')
          echo "tests passed: $total (minimum expected: $MIN_TESTS)"
          if [ "$total" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $total tests ran; expected at least $MIN_TESTS. A test module may have become unwired."
            exit 1
          fi

  coverage:
    name: coverage
    # No point measuring coverage until the workspace builds and tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - uses: taiki-e/install-action@cargo-llvm-cov

      # Vault first: the factory embeds the vault wasm via contractimport!, a
      # dependency cargo cannot see, so a single workspace build can race.
      - name: Build contracts (wasm)
        run: |
          cargo build --release --target wasm32v1-none -p stellar-vault
          cargo build --release --target wasm32v1-none -p stellar-vault-factory
          cargo build --release --target wasm32v1-none -p stellar-vault-registry

      - name: Line coverage
        run: cargo llvm-cov --workspace --summary-only

      # Written to disk so the report can be published alongside the
      # verification page rather than living only in CI logs.
      - name: Coverage report (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: contracts/lcov.info

      # Deliverable 1.3 raises this gate to 85. Left ungated until the suite
      # reaches that level, so the number is reported honestly in the meantime
      # rather than being quietly skipped.
      - name: Coverage floor
        run: cargo llvm-cov --workspace --summary-only --fail-under-lines 1
